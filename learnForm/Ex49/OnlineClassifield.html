<html>
    <head>
        <title>Online Classified Search Form</title>
        <style>
            body {
                background-color: rgb(179, 246, 248);
                font-family: "Times New Roman", Times, serif;
                margin: 20px;
                padding: 10px;
                width: 670px;
                min-height: 630px;
            }

            h1 {
                color: red;
                font-size: 28px;
                margin: 10px 0 24px;
            }

            hr {
                border: 0;
                border-top: 1px solid #333;
                margin-bottom: 20px;
            }

            p {
                font-size: 18px;
                margin: 15px 0 10px;
            }

            .question {
                font-weight: bold;
            }

            table {
                font-size: 18px;
            }

            td {
                padding-right: 15px;
                padding-bottom: 4px;
            }

            input[type="text"] {
                width: 590px;
                height: 20px;
                font-family: "Times New Roman", Times, serif;
            }

            input[type="date"] {
                width: 160px;
                height: 22px;
                margin: 0 5px;
            }

            .button-group {
                margin-top: 15px;
            }

            .button-group img {
                margin-right: 25px;
                vertical-align: middle;
            }

            .button-group button {
                border: 0;
                background: none;
                padding: 0;
                cursor: pointer;
            }
        </style>
    </head>

    <body>
        <h1>Online Classified Search Form</h1>
        <hr>

        <form id="searchForm" action="Search.html" method="get">

            <p class="question">1) Search for a classified in the following sections:</p>
            <table>
                <tr>
                    <td><input type="radio" name="section" value="Employment" id="employ">
                        <label for="employ">Employment</label></td>
                    <td><input type="radio" name="section" value="Personal" id="personal">
                        <label for="personal">Personal</label></td>
                </tr>
                <tr>
                    <td><input type="radio" name="section" value="For Sale" id="sale">
                        <label for="sale">For Sale</label></td>
                    <td><input type="radio" name="section" value="Miscellaneous" id="miscellanecus">
                        <label for="miscellanecus">Miscellaneous</label></td>
                </tr>
                <tr>
                    <td><input type="radio" name="section" value="Housing" id="house">
                        <label for="house">Housing</label></td>
                    <td><input type="radio" name="section" value="All" id="all">
                        <label for="all">All of the above</label></td>
                </tr>
            </table>

            <p class="question">2) Search the following publications:</p>
            <table>
                <tr>
                    <td><input id="Midwest" type="checkbox" name="publication" value="Midwest">
                        <label for="Midwest">Midwest times</label></td>
                    <td><input id="News" type="checkbox" name="publication" value="Modern News">
                        <label for="News">Modern News</label></td>
                    <td><input id="today" type="checkbox" name="publication" value="Employment Today">
                        <label for="today">Employment Today</label></td>
                </tr>
                <tr>
                    <td><input id="great" type="checkbox" name="publication" value="Great Lakes Classifieds">
                        <label for="great">Great Lakes Classifieds</label></td>
                    <td><input id="daily" type="checkbox" name="publication" value="Middleton Daily">
                        <label for="daily">Middleton Daily</label></td>
                    <td><input id="dailynews" type="checkbox" name="publication" value="Cashtown Daily News">
                        <label for="dailynews">Cashtown Daily News</label></td>
                </tr>
            </table>

            <p class="question">3) From to
                <input type="date" name="from" id="from">
                to
                <input type="date" name="to" id="to">
            </p>

            <p class="question">4) Enter a few keywords to describe the classified.</p>
            <input type="text" name="keywords" id="keywords">

            <p class="question">5) Click one of the options below:</p>

            <div class="button-group">
                <button type="submit"><img src="Bai49/Search.gif" alt="Search"></button>

                <a href="Help.html" target="_blank">
                    <img src="Bai49/Help.gif" alt="Help">
                </a>

                <button type="reset">
                    <img src="Bai49/Cancel.gif" alt="Cancel">
                </button>
            </div>

        </form>
    </body>
</html>
